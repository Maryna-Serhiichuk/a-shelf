name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts || true

      - name: Copy project files to server
        run: |
          rsync -avz --exclude '.git' ./ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.TARGET_DIR }}

      - name: Create .env file on server
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
            cat <<EOF > ${{ secrets.TARGET_DIR }}/backend/.env
            APP_KEYS=${{ secrets.APP_KEYS }}
            API_TOKEN_SALT=${{ secrets.API_TOKEN_SALT }}
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            TRANSFER_TOKEN_SALT=${{ secrets.TRANSFER_TOKEN_SALT }}
            DATABASE_CLIENT=${{ secrets.DATABASE_CLIENT }}
            DATABASE_FILENAME=${{ secrets.DATABASE_FILENAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
          "

      - name: Restart containers
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
            cd ${{ secrets.TARGET_DIR }} &&
            docker-compose up -d --build
          "